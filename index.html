<!DOCTYPE html>

  <style>
    :root{
      --sidebar: #d1afce;
      --sidebarText: #000000;
      --content: #fbfbfb;
      --codeBg: #ffffff;
      --codeLine: #2d2d2d;
      --accent: #4caf50;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#d9f0ff, #e8ffe6);
    }

    /* Layout umum */
    .container {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* Sidebar  */
    .sidebar {
      background: var(--sidebar);
      color: var(--sidebarText);

      padding: 10px 20px;

      display: flex;
      align-items: center;
      width: 100%;
      min-height: 70px;
       border-bottom: 1px solid #999; /*digunakan untuk membuat garis bawah sidebar */
    }

    .brand {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .logo {
      font-family: "Harlow Solid", cursive;
      font-size: 30px;
      /* font-weight: bold; */
      color: #000000;
      margin-right: 20px;
      white-space: nowrap;
    }

    .menu {
      list-style: none;
      padding: 0;
       margin:0 0 0 auto; /* membuat menu ke kanan */

      display: flex;
      align-items: center;
      gap: 0 px;
    }

    .menu li {
      padding: 8px 6px;
      border-radius: 4px;
    }

    .menu li + li {
      margin-top: 0;
    }

    .menu a {
      color: #000000;
      text-decoration: none;
      display: block;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .menu a:hover {
      background: #ffffff;
    }
